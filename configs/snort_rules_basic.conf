# Basic Snort NIDS Rules for Security+ & CySA+ Labs
# Alert on incoming ICMP Ping requests
alert icmp any any -> $HOME_NET any (msg:"ICMP Packet Detected"; sid:1000001; rev:1;)

# Alert on HTTP GET request to admin directory
alert tcp any any -> $HOME_NET 80 (msg:"Possible Admin Directory Scan"; content:"GET /admin"; sid:1000002; rev:1;)
